        .sidebar-header { font-size: 18px; font-weight: bold; color: #ffffff; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #333333; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-close-btn { font-size: 24px; color: #888888; cursor: pointer; }

        .region-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-bottom: 20px; align-content: start; }
        #major-grid { flex: 1; min-height: 0; overflow-y: auto; }
        #sub-container { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 20px; }

        function selectMajor(majorName) {
            document.getElementById('major-grid').style.display = 'none';
            const subContainer = document.getElementById('sub-container');
            subContainer.style.display = 'block';
            document.getElementById('sheet-title-text').innerText = majorName + " 시·군·구 선택";
            const subGrid = document.getElementById('sub-grid');
            subGrid.innerHTML = '';
            const list = subRegionsData[majorName] || [];
            list.forEach(sub => {
                const btn = document.createElement('div');
                btn.className = 'region-btn';
                btn.innerText = sub;
                btn.onclick = function() { selectSubRegion(majorName, sub); };
                subGrid.appendChild(btn);
            });
            subContainer.scrollTop = 0;
        }

        function backToMajor() {
            document.getElementById('major-grid').style.display = 'grid';
            document.getElementById('sub-container').style.display = 'none';
            document.getElementById('sheet-title-text').innerText = "접속지역 시/도 선택";
        }

        function selectSubRegion(major, sub) {

            closeRegionPopup();

        function syncHeaderPadding() {
            const header = document.querySelector('.header-container');
            const container = document.querySelector('.mobile-container');
            if (header && container) {
                container.style.paddingTop = header.offsetHeight + 'px';
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            syncHeaderPadding();
            const headerImg = document.querySelector('.header-container img');
